<style>
:root{--bg:#f8f9fa;--s1:#fff;--s2:#f1f3f5;--s3:#e9ecef;--ink:#212529;--ink2:#495057;--ink3:#6c757d;--line:#ced4da;--err:#ba1a1a;--errbg:#ffdad6;--on:#fff;--sh:#212529;
--fi:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--fm:'JetBrains Mono',ui-monospace,Consolas,monospace}
[data-theme=dark]{--bg:#0c1014;--s1:#161a1e;--s2:#1d2227;--s3:#272d33;--ink:#e9ecef;--ink2:#adb5bd;--ink3:#8b939a;--line:#3a4149;--errbg:#3b1512;--err:#ffb4ab;--on:#0c1014;--sh:#5b6168}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--fi);transition:background .15s,color .15s}
[hidden]{display:none!important}
.mono{font-family:var(--fm);font-feature-settings:"tnum"}.tiny{font-size:11px}.muted{color:var(--ink3)}.grow{flex:1;min-width:0}.mt{margin-top:12px}.r{text-align:right}
h1,h2,h3{margin:0;letter-spacing:-.015em}h2{font-size:24px;font-weight:700}h3{font-size:16px;font-weight:600}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--ink);z-index:99;transition:width .25s}#bar.on{width:70%}
/* kontrol */
.btn{min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:4px;background:var(--s1);color:var(--ink);font:600 12px var(--fm);letter-spacing:.04em;cursor:pointer;box-shadow:3px 3px 0 var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:none}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{background:var(--ink);color:var(--on)}.btn.d{background:var(--errbg);color:var(--err);border-color:var(--err);box-shadow:3px 3px 0 var(--err)}
.btn.sm{min-height:32px;padding:0 10px;font-size:11px;box-shadow:2px 2px 0 var(--sh)}.btn.ic{width:44px;padding:0;font-size:16px}.btn.wide{width:100%}
.btn:focus-visible,.in:focus-visible,a:focus-visible{outline:3px solid var(--ink3);outline-offset:2px}
.in{width:100%;height:40px;padding:0 10px;border:1px solid var(--ink2);border-radius:4px;background:var(--s1);color:var(--ink);font:400 14px var(--fi)}
.in:focus{border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);outline:0}textarea.in{height:auto;padding:8px 10px}
.in.bad{border-color:var(--err);background:var(--errbg)}
label{display:block;margin:12px 0 4px;font:600 12px var(--fi)}
.badge{display:inline-block;padding:1px 7px;border:1px solid var(--ink);border-radius:4px;font:600 10px var(--fm);letter-spacing:.04em;text-transform:uppercase;background:var(--s1)}
.badge.solid{background:var(--ink);color:var(--on)}.badge.mute{background:var(--s3);border-color:var(--ink2);color:var(--ink2)}
.badge.hatch{background:repeating-linear-gradient(45deg,var(--s1) 0 4px,var(--line) 4px 6px)}.badge.err{background:var(--errbg);border-color:var(--err);color:var(--err)}
.alert{padding:10px 12px;background:var(--errbg);border:1px solid var(--err);color:var(--err);border-radius:4px;margin:12px 0;font-weight:500}
.card{background:var(--s1);border:2px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--sh);padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1fr}
.l-brand{background:#212529;color:#f1f3f5;padding:28px 24px;background-image:radial-gradient(#3a4046 1px,transparent 1px);background-size:14px 14px}
.l-brand h1{font-size:34px;line-height:1.1;margin:28px 0 12px}.l-brand p{color:#adb5bd;max-width:46ch}
.l-feat{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px;font-size:12px}.l-feat li{border:1px solid #495057;padding:10px;border-radius:4px;background:#2b3035}
.l-form{padding:24px;display:flex;flex-direction:column;justify-content:center;max-width:460px;width:100%;margin:0 auto}.l-top{margin-bottom:auto}.l-form form{margin:32px 0}
@media(min-width:900px){.login{grid-template-columns:1.1fr 1fr}.l-brand{padding:48px}.l-brand h1{font-size:48px}.l-form{padding:48px}}
/* app */
#app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:260px;background:var(--s2);border-right:2px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto;transform:translateX(-100%);transition:transform .15s;z-index:30}
.nav-open .side{transform:none}.scrim{position:fixed;inset:0;background:rgba(33,37,41,.6);z-index:20;display:none}.nav-open .scrim{display:block}
.brand{display:flex;gap:10px;align-items:center;padding:4px 4px 12px;border-bottom:1px solid var(--line)}.logo{width:36px;height:36px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;border-radius:4px;background:var(--s1)}
.ngrp{font:700 10px var(--fm);letter-spacing:.08em;color:var(--ink3);margin:12px 4px 4px}
.nl{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:4px;background:none;color:var(--ink);font:500 13px var(--fi);cursor:pointer;text-align:left}
.nl:hover{background:var(--s3)}.nl.on{background:var(--ink);color:var(--on);font-weight:600}.nl svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.top{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--s1);border-bottom:2px solid var(--ink)}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;line-height:1.1}.who b{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide-s{display:none}.main{padding:14px 12px 80px}.sec{display:none;animation:none}.sec.on{display:block}
@media(min-width:1024px){.side{transform:none}.top,.main{margin-left:260px}.top .ic:first-child,.scrim{display:none!important}.main{padding:24px 32px 80px}.hide-s{display:inline}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}
@media(min-width:900px){.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.3fr 1fr}}
.kpi .lb{font:700 10px var(--fm);letter-spacing:.08em;color:var(--ink2)}.kpi .v{font:700 30px/1.2 var(--fm);letter-spacing:-.03em;margin-top:6px}
.bars{display:grid;gap:8px;margin-top:10px}.bar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font:500 12px var(--fm)}
.bar i{display:block;height:16px;border:1px solid var(--ink);background:var(--s3)}.bar i b{display:block;height:100%;background:var(--ink)}
.donut{width:150px;height:150px;border-radius:50%;margin:8px auto;border:2px solid var(--ink)}.legend{display:grid;gap:4px;font:500 12px var(--fm)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;border:1px solid var(--ink);background:var(--c)}
/* tabel */
.tw{overflow-x:auto;border:2px solid var(--ink);border-radius:4px;background:var(--s1)}
table{border-collapse:collapse;width:100%;min-width:620px}th{background:var(--s2);border-bottom:2px solid var(--ink);font:700 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:8px 12px;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:nth-child(even){background:var(--bg)}tbody tr:hover{background:var(--s3)}td.n,th.n{text-align:right;font-family:var(--fm)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools .in{width:auto;flex:1 1 150px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font:500 12px var(--fm);flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.gal .card{padding:10px;cursor:pointer}
.ph{aspect-ratio:3/4;border:2px solid var(--ink);background:linear-gradient(to top right,transparent calc(50% - 1px),var(--line),transparent calc(50% + 1px)),linear-gradient(to top left,transparent calc(50% - 1px),var(--line),transparent calc(50% + 1px)),var(--s2);display:grid;place-items:center}
.ph{overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph span{background:var(--s1);border:1px solid var(--ink);padding:1px 6px;font:500 10px var(--fm)}
/* nilai */
.ni{width:54px;height:34px;text-align:center;font:500 13px var(--fm);padding:0}.ni.bad{border:2px solid var(--err);background:var(--errbg)}.low td{background:var(--errbg)!important}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tab{min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:4px;background:var(--s1);color:var(--ink);font:600 12px var(--fm);cursor:pointer}.tab.on{background:var(--ink);color:var(--on)}
.chk{display:flex;align-items:center;gap:8px;min-height:40px;border-bottom:1px solid var(--line)}.chk input{width:18px;height:18px;accent-color:var(--ink)}
/* modal, toast */
.overlay{position:fixed;inset:0;background:rgba(33,37,41,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;overflow:auto;padding:0}
.modal{background:var(--s1);border:2px solid var(--ink);border-radius:8px 8px 0 0;box-shadow:6px 6px 0 var(--sh);width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px}
@media(min-width:640px){.overlay{align-items:center;padding:20px}.modal{border-radius:8px}}
.fg{display:grid;gap:0 12px;grid-template-columns:1fr}@media(min-width:560px){.fg{grid-template-columns:1fr 1fr}.fg .full{grid-column:1/-1}}
.toasts{position:fixed;right:12px;bottom:12px;display:grid;gap:8px;z-index:90;max-width:calc(100vw - 24px)}
.toast{padding:10px 14px;border:2px solid var(--ink);background:var(--s1);box-shadow:4px 4px 0 var(--sh);border-radius:4px;font-weight:500}.toast.err{background:var(--errbg);color:var(--err);border-color:var(--err);box-shadow:4px 4px 0 var(--err)}
.dl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px}.dl dt{color:var(--ink3)}.dl dd{margin:0;font-weight:500}
/* cetak A4 */
.pv{position:fixed;inset:0;background:var(--s3);z-index:70;overflow:auto;padding:0 0 30px}.pvbar{position:sticky;top:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:var(--s1);border-bottom:2px solid var(--ink);z-index:2}
.a4{background:#fff;color:#000;width:210mm;min-height:297mm;margin:14px auto;padding:14mm 16mm;font:12px/1.35 'Times New Roman',serif;box-shadow:4px 4px 0 #212529;position:relative;page-break-after:always}
.a4 .kop{text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:10px}.a4 .kop b{display:block;font-size:14px;text-transform:uppercase}.a4 .kop .s{font-size:17px}
.a4 h4{text-align:center;margin:8px 0;font-size:14px;text-decoration:underline}.a4 table{min-width:0;margin-bottom:8px;border:1.5px solid #000}.a4 th{background:#e9ecef;color:#000;font:700 11px 'Times New Roman',serif;letter-spacing:0;border:1px solid #000;padding:3px 6px}
.a4 td{border:1px solid #000;padding:3px 6px;background:#fff!important}.a4 .sec-t{background:#e9ecef;font-weight:700}.a4 .ttd{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px}
.a4 .ph{width:30mm;border-color:#000}.a4 p{margin:6px 0;text-align:justify}.a4 .wm{position:absolute;inset:40% 0 auto;text-align:center;font:700 60px Arial;color:rgba(186,26,26,.15);transform:rotate(-20deg);pointer-events:none}.a4 .sig{text-align:center;min-width:60mm}
@media(max-width:820px){.a4{transform-origin:top left;zoom:.45;margin:8px}}
@media print{@page{size:A4;margin:0}body>*:not(#pv){display:none!important}.pv{position:static;background:none;padding:0;overflow:visible}.pvbar{display:none}.a4{margin:0;box-shadow:none;zoom:1;width:210mm}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
